name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 子模块完整性校验
  # ------------------------------------------------------------------
  submodule-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 验证 .gitmodules 与 gitlink 一致
        run: |
          set -e
          git submodule status --recursive
          git submodule foreach --recursive 'git status --short --branch || true'

  # ------------------------------------------------------------------
  # hisiflash (Rust) — 构建 + 测试
  # ------------------------------------------------------------------
  hisiflash:
    runs-on: ubuntu-latest
    needs: submodule-check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: 构建 hisiflash
        working-directory: hisiflash
        run: cargo build --release --locked

      - name: 测试 hisiflash
        working-directory: hisiflash
        run: cargo test --locked

  # ------------------------------------------------------------------
  # location_app (Android) — 构建检查
  # ------------------------------------------------------------------
  location-app:
    runs-on: ubuntu-latest
    needs: submodule-check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: 构建 location_app (assembleDebug)
        working-directory: location_app
        run: ./gradlew assembleDebug --no-daemon
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}

  # ------------------------------------------------------------------
  # 文档链接校验
  # ------------------------------------------------------------------
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Markdown 内部链接
        run: |
          set -e
          echo "检查 AGENTS.md 中引用的文档文件是否存在..."
          for doc in \
            README.md \
            Docs/README.md \
            "Docs/硬件设计.md" \
            "Docs/软件仓库.md" \
            "Docs/测试方案.md" \
            "Docs/焊接与调试指南.md" \
            "Docs/工程管理.md"; do
            if [ -f "$doc" ]; then
              echo "  [OK] $doc"
            else
              echo "  [MISSING] $doc"
              exit 1
            fi
          done
          echo "所有索引文档存在性检查通过"
